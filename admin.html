<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Peta Skill</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0F4F2;
    --surface: #FFFFFF;
    --ink: #1C2B27;
    --ink-muted: #64746E;
    --primary: #2F6F62;
    --primary-tint: #E4EEEA;
    --line: #E2E8E4;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    background: var(--surface);
    padding: 24px 48px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
  }
  .header h1 { margin: 0; font-size: 22px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 12px; }
  .header h1::before { content: '⚙️'; font-size: 24px; }
  
  .container { padding: 40px 48px; max-width: 1400px; margin: 0 auto; }
  
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 24px;
    margin-bottom: 40px;
  }
  .card {
    background: var(--surface);
    padding: 28px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(28,43,39,0.04);
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--primary); border-radius: 4px 0 0 4px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; color: var(--ink-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
  .card .value { font-size: 36px; font-weight: 700; margin: 0; color: var(--ink); }
  
  .table-wrapper {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 8px 24px rgba(28,43,39,0.04);
    overflow: hidden;
  }
  .table-header {
    padding: 24px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .table-header h2 { margin: 0; font-size: 18px; }
  
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  th { background: #F9FBFB; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--ink-muted); }
  td { font-size: 15px; }
  tr:hover td { background: #F9FBFB; }
  tr:last-child td { border-bottom: none; }
  
  .chip {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    background: var(--primary-tint);
    color: var(--primary);
  }
  
  .btn {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: white;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(47, 111, 98, 0.2); }
  .btn:active { transform: translateY(0); }
  
  .btn-outline {
    background: transparent;
    border: 1px solid #D1DBD7;
    color: var(--ink-muted);
  }
  .btn-outline:hover { background: #F9FBFB; box-shadow: none; border-color: var(--ink); color: var(--ink); }
  
  .actions { display: flex; gap: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>Dashboard Analitik</h1>
  <div class="actions">
    <button class="btn btn-outline" onclick="clearData()">🗑️ Reset Data</button>
    <button class="btn" onclick="exportCsv()">📥 Export CSV</button>
  </div>
</div>

<div class="container">
  <div class="metrics">
    <div class="card">
      <h3>Total Mulai Kuis</h3>
      <p class="value" id="val-starts">0</p>
    </div>
    <div class="card">
      <h3>Total Leads (Form)</h3>
      <p class="value" id="val-leads">0</p>
    </div>
    <div class="card">
      <h3>Conversion Rate</h3>
      <p class="value" id="val-conv">0%</p>
    </div>
    <div class="card">
      <h3>Persona Populer</h3>
      <p class="value" id="val-persona" style="font-size:26px; line-height: 1.4;">-</p>
    </div>
  </div>

  <div class="table-wrapper">
    <div class="table-header">
      <h2>Data User Terbaru</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Tanggal & Waktu</th>
          <th>Nama</th>
          <th>Email</th>
          <th>WhatsApp</th>
          <th>Hasil Persona</th>
          <th>Demografi</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <!-- Data goes here -->
      </tbody>
    </table>
  </div>
</div>

<script>
  let leads = [];
  let starts = 0;

  function loadData() {
    leads = JSON.parse(localStorage.getItem('arah_leads') || '[]');
    let analytics = JSON.parse(localStorage.getItem('arah_analytics') || '{"starts":0}');
    starts = analytics.starts;
    render();
  }

  function render() {
    // Metrics
    document.getElementById('val-starts').innerText = starts.toLocaleString('id-ID');
    document.getElementById('val-leads').innerText = leads.length.toLocaleString('id-ID');
    
    let conv = starts > 0 ? ((leads.length / starts) * 100).toFixed(1) : 0;
    document.getElementById('val-conv').innerText = conv + '%';

    // Popular Persona
    let personaCount = {};
    let topPersona = '-';
    let max = 0;
    leads.forEach(l => {
      personaCount[l.hasil] = (personaCount[l.hasil] || 0) + 1;
      if (personaCount[l.hasil] > max) {
        max = personaCount[l.hasil];
        topPersona = l.hasil.toUpperCase();
      }
    });
    document.getElementById('val-persona').innerText = topPersona;

    // Table
    const tbody = document.getElementById('table-body');
    if (leads.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px; color:#888;">Belum ada data masuk.</td></tr>';
      return;
    }

    // reverse for newest first
    const sortedLeads = [...leads].reverse();

    tbody.innerHTML = sortedLeads.map(l => {
      let dateObj = new Date(l.timestamp);
      let dateStr = isNaN(dateObj) ? '-' : dateObj.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
      return '<tr>' +
          '<td>' + dateStr + '</td>' +
          '<td><strong>' + l.name + '</strong></td>' +
          '<td>' + l.email + '</td>' +
          '<td>' + (l.wa || '-') + '</td>' +
          '<td><span class="chip">' + l.hasil + '</span></td>' +
          '<td>' + (l.demografi || '-') + '</td>' +
        '</tr>';
    }).join('');
  }

  function clearData() {
    if(confirm('Yakin ingin mereset semua data kuis dan leads?')) {
      localStorage.removeItem('arah_leads');
      localStorage.removeItem('arah_analytics');
      loadData();
    }
  }

  function exportCsv() {
    if(leads.length === 0) return alert("Tidak ada data untuk diexport");
    
    let csv = 'Tanggal,Nama,Email,WhatsApp,Hasil Persona,Demografi\\n';
    leads.forEach(l => {
      csv += '"' + l.timestamp + '","' + l.name + '","' + l.email + '","' + (l.wa||'') + '","' + l.hasil + '","' + (l.demografi||'') + '"\\n';
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads_peta_skill.csv';
    a.click();
  }

  loadData();
</script>
</body>
</html>
