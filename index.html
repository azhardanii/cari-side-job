<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peta Skill & Side Job Kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #EFF2EA;
    --bg-2: #E4EEEA;
    --bg-3: #F6ECD6;
    --surface: #FFFFFF;
    --ink: #1C2B27;
    --ink-muted: #64746E;
    --primary: #2F6F62;
    --primary-dark: #20493F;
    --primary-glow: rgba(47, 111, 98, 0.4);
    --primary-tint: #E4EEEA;
    --gold: #D6A544;
    --gold-soft: #FDF9F1;
    --gold-line: #F0DCAE;
    --berry: #B94E6B;
    --line: #E2E8E4;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --font-display: 'Fraunces', serif;
    --font-body: 'Plus Jakarta Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #ffffff);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    min-height: 100vh;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .shell {
    width: 100%;
    max-width: 640px;
    perspective: 1000px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius-xl);
    padding: clamp(32px, 6vw, 56px);
    box-shadow: 0 40px 80px -20px rgba(28,43,39,0.12), 
                0 0 0 1px rgba(255,255,255,0.6) inset;
    border: 1px solid rgba(255,255,255,0.4);
    position: relative;
    overflow: hidden;
  }

  /* Decorative blur blobs behind the card */
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: -1;
    opacity: 0.6;
    animation: float 10s ease-in-out infinite alternate;
  }
  .blob-1 {
    width: 300px; height: 300px;
    background: var(--primary-tint);
    top: 10%; left: 10%;
  }
  .blob-2 {
    width: 250px; height: 250px;
    background: var(--gold-soft);
    bottom: 10%; right: 10%;
    animation-delay: -5s;
  }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(30px, 50px) scale(1.1); }
  }

  h1, h2, h3 {
    font-family: var(--font-display);
    font-weight: 600;
    margin: 0 0 16px;
    line-height: 1.25;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  p { margin: 0 0 16px; line-height: 1.6; color: var(--ink); }
  .muted { color: var(--ink-muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: none;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 16px;
    border-radius: 999px;
    padding: 16px 32px;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
  }
  .btn:active { transform: scale(0.96); }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: #fff;
    box-shadow: 0 10px 24px -8px var(--primary-glow);
  }
  .btn-primary:hover { 
    transform: translateY(-2px);
    box-shadow: 0 14px 32px -8px var(--primary-glow);
  }

  .btn-ghost {
    background: transparent;
    color: var(--primary);
    padding: 12px 20px;
    font-size: 15px;
    border-radius: var(--radius-sm);
  }
  .btn-ghost:hover { 
    background: var(--primary-tint);
  }

  .btn-gold {
    background: linear-gradient(135deg, var(--gold), #c99837);
    color: #fff;
    box-shadow: 0 8px 20px -6px rgba(214, 165, 68, 0.5);
  }
  .btn-gold:hover { 
    transform: translateY(-2px);
    box-shadow: 0 12px 28px -6px rgba(214, 165, 68, 0.6);
  }

  /* ---------- Animations ---------- */
  .animate-in {
    animation: fadeSlideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(16px) scale(0.98); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ---------- Intro ---------- */
  .hero-art { width: 100%; max-width: 320px; margin: 0 auto 32px; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.05)); }

  .intro { text-align: center; }
  .intro h1 { font-size: clamp(32px, 7vw, 44px); margin-bottom: 16px;}
  .intro p.lead { font-size: 18px; max-width: 480px; margin-left: auto; margin-right: auto; margin-bottom: 8px;}
  .meta-note { font-size: 14px; color: var(--ink-muted); margin-bottom: 32px; font-weight: 500;}
  .intro .btn-primary { width: 100%; max-width: 340px; font-size: 17px; padding: 18px 32px; }

  /* ---------- Progress ---------- */
  .progress-wrap { margin-bottom: 32px; }
  .progress-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 12px; }
  .progress-label { font-size: 14px; color: var(--ink-muted); font-weight: 600; }
  .progress-percent { font-size: 18px; font-family: var(--font-display); font-weight: 700; color: var(--primary); }
  
  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #419685);
    border-radius: 999px;
    transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    position: relative;
  }
  .progress-bar-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    animation: shimmer 2s infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ---------- Quiz ---------- */
  .question h2 { font-size: clamp(22px, 5vw, 28px); margin-bottom: 24px; }
  .options { display: flex; flex-direction: column; gap: 12px; }

  .option {
    display: flex;
    align-items: center;
    gap: 16px;
    text-align: left;
    width: 100%;
    background: #F8FAF9;
    border: 2px solid transparent;
    border-radius: var(--radius-md);
    padding: 18px 20px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .option:hover { 
    background: #FFFFFF;
    border-color: var(--primary-tint); 
    transform: translateY(-2px);
    box-shadow: 0 8px 16px -4px rgba(47, 111, 98, 0.08);
  }
  .option.selected { 
    border-color: var(--primary); 
    background: var(--primary-tint); 
    transform: translateY(-2px);
    box-shadow: 0 8px 16px -4px rgba(47, 111, 98, 0.15);
  }

  .option .marker {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #C4D1CC;
    position: relative;
    transition: all 0.2s ease;
    background: #fff;
  }
  .option:hover .marker { border-color: var(--primary); }
  .option.selected .marker { 
    border-color: var(--primary); 
    background: var(--primary);
  }
  .option.selected .marker::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { transform: translate(-50%, -50%) scale(0); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  .quiz-nav { 
    margin-top: 24px; 
    display: flex;
    justify-content: flex-start;
  }

  /* ---------- Lead Form ---------- */
  .lead-form { text-align: center; }
  .lead-form h2 { font-size: clamp(24px, 6vw, 32px); margin-bottom: 12px; }
  .lead-form p { font-size: 16px; margin-bottom: 24px; color: var(--ink-muted); }
  .form-group { margin-bottom: 16px; text-align: left; }
  .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; color: var(--ink); }
  .form-group input { 
    width: 100%; 
    padding: 16px 18px; 
    border-radius: var(--radius-sm);
    border: 2px solid var(--line);
    background: #F8FAF9;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    transition: all 0.25s ease;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 4px 12px rgba(47, 111, 98, 0.1);
  }
  .form-group input::placeholder { color: #A0B0AA; }
  .form-group small { display: block; margin-top: 6px; font-size: 13px; color: var(--ink-muted); }

  /* ---------- Loading ---------- */
  .loading { text-align: center; padding: 40px 0; }
  .compass-wrap {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    position: relative;
  }
  .compass-spin { 
    width: 100%; height: 100%; 
    animation: spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; 
    filter: drop-shadow(0 8px 16px rgba(214, 165, 68, 0.3));
  }
  .loading h2 { font-size: 24px; margin-bottom: 8px;}
  .loading p { font-size: 16px;}
  
  @keyframes spin { 
    0% { transform: rotate(0deg); } 
    50% { transform: rotate(180deg); }
    100% { transform: rotate(360deg); } 
  }

  /* ---------- Result ---------- */
  .badge-block { text-align: center; margin-bottom: 16px; }

  .medallion {
    width: 120px; height: 120px;
    margin: 0 auto 24px;
    position: relative;
    animation: floatMedal 4s ease-in-out infinite;
  }
  @keyframes floatMedal {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .medallion svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 12px 24px rgba(214, 165, 68, 0.2)); }
  .medallion .icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
    animation: popIcon 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
  }
  @keyframes popIcon {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .badge-block h1 { font-size: clamp(28px, 6vw, 36px); margin-bottom: 8px; color: var(--primary-dark); }
  .badge-block .tagline { font-size: 16px; color: var(--ink-muted); max-width: 460px; margin: 0 auto; line-height: 1.6;}

  .divider { 
    height: 1px; 
    background: linear-gradient(90deg, transparent, var(--line), transparent); 
    margin: 32px 0; 
    border: none; 
  }

  .section-title { 
    font-size: 15px; 
    text-transform: uppercase;
    letter-spacing: 1px; 
    color: var(--primary); 
    font-weight: 700; 
    margin-bottom: 20px; 
    font-family: var(--font-body); 
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .why-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .why-list li { 
    display: flex; gap: 16px; font-size: 16px; line-height: 1.6; 
    background: #F8FAF9;
    padding: 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
  }
  .why-list li .chip {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold-soft); color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }

  .timeline { display: flex; flex-direction: column; }
  .tl-item { display: flex; gap: 20px; position: relative; }
  .tl-marker { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; width: 32px; position: relative; z-index: 2;}
  .tl-num {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; font-family: var(--font-body);
    flex: 0 0 auto;
    box-shadow: 0 4px 12px var(--primary-glow);
  }
  .tl-line { 
    flex: 1; width: 2px; background: var(--primary-tint); 
    margin: 8px 0; min-height: 24px; 
    border-radius: 2px;
  }
  .tl-item:last-child .tl-line { display: none; }
  .tl-body { padding-bottom: 28px; padding-top: 4px;}
  .tl-body h3 { font-size: 18px; margin-bottom: 6px; font-family: var(--font-body); font-weight: 700; }
  .tl-body p { font-size: 15px; color: var(--ink-muted); margin-bottom: 0; }

  .product-panel {
    background: linear-gradient(135deg, var(--gold-soft), #fff);
    border: 1px solid var(--gold-line);
    border-radius: var(--radius-lg);
    padding: 28px;
    position: relative;
    overflow: hidden;
  }
  .product-panel::before {
    content: '';
    position: absolute;
    top: -50px; right: -50px;
    width: 150px; height: 150px;
    background: var(--gold);
    opacity: 0.05;
    border-radius: 50%;
  }
  .product-panel h3 { font-family: var(--font-body); font-size: 20px; font-weight: 700; margin-bottom: 10px; color: #3A2C0E;}
  .product-panel p { font-size: 15.5px; margin-bottom: 20px; color: #5c4b26; line-height: 1.6;}
  .product-panel .btn { width: 100%; font-size: 16px; padding: 16px;}

  .bonus-note { 
    font-size: 15px; line-height: 1.6; margin-bottom: 0; 
    background: var(--bg-1); padding: 16px 20px; border-radius: var(--radius-md);
    text-align: center;
  }
  .bonus-note a, .footer-note a { color: var(--primary); font-weight: 700; text-decoration: none; position: relative; }
  .bonus-note a::after, .footer-note a::after {
    content: '';
    position: absolute; left: 0; bottom: -2px; width: 100%; height: 2px;
    background: var(--primary); transform: scaleX(0); transform-origin: right;
    transition: transform 0.3s ease;
  }
  .bonus-note a:hover::after, .footer-note a:hover::after {
    transform: scaleX(1); transform-origin: left;
  }

  .footer-note { text-align: center; margin-top: 32px; }
  .footer-note p { font-size: 14.5px; color: var(--ink-muted); }

  .restart-wrap { text-align: center; margin-top: 12px; }

  @media (max-width: 480px) {
    .card { border-radius: 24px; padding: 24px; }
    .intro h1 { font-size: 28px; }
    .btn { padding: 14px 24px; }
    .product-panel { padding: 20px; }
  }
</style>
</head>

let screen = 'intro';

let scoreTally = {};
let bonusKey = null;
let userData = { name: '', email: '', wa: '' };

const app = document.getElementById('app');

function animateTransition(renderFunc) {
  app.classList.remove('animate-in');
  void app.offsetWidth; // trigger reflow
  app.classList.add('animate-in');
  renderFunc();
}

/* ============ RENDER: QUIZ ============ */

function renderQuiz(){
  const q = ALL_QUESTIONS[step];
  const total = ALL_QUESTIONS.length;
  const progressPercent = Math.round((step / total) * 100);

  const options = q.options.map((opt, i) => `
    <button class="option" onclick="selectOption(${i})">
      <span class="marker"></span>
      <span>${opt.label}</span>
    </button>
  `).join('');

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-header">
        <div class="progress-label">Pertanyaan ${step + 1} dari ${total}</div>
        <div class="progress-percent">${progressPercent}%</div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
      </div>
    </div>
    <div class="question">
      <h2>${q.text}</h2>
      <div class="options">${options}</div>
    </div>
    <div class="quiz-nav">
      ${step > 0 ? `<button class="btn btn-ghost" onclick="goBack()">← Kembali</button>` : ``}
    </div>
  `;
}

function selectOption(i){
  const q = ALL_QUESTIONS[step];
  const opt = q.options[i];

  if(q.key === 'q6'){
    bonusKey = opt.bonus;
  } else {
    Object.entries(opt.scores).forEach(([k,v]) => {
      scoreTally[k] = (scoreTally[k] || 0) + v;
    });
  }

  const buttons = app.querySelectorAll('.option');
  buttons.forEach((b, idx) => { if(idx === i) b.classList.add('selected'); else b.classList.remove('selected'); });

  setTimeout(() => {
    if(step < ALL_QUESTIONS.length - 1){
      step += 1;
      animateTransition(renderQuiz);
    } else {
      animateTransition(renderLeadForm);
    }
  }, 400);
}

function goBack(){
  if(step > 0){
    step -= 1;
    animateTransition(renderQuiz);
  }
}

function startQuiz(){
  screen = 'quiz';
  step = 0;
  scoreTally = {};
  bonusKey = null;

  // Track quiz starts
  let analytics = JSON.parse(localStorage.getItem('arah_analytics') || '{"starts":0}');
  analytics.starts += 1;
  localStorage.setItem('arah_analytics', JSON.stringify(analytics));

  animateTransition(renderQuiz);
}

function submitForm(e) {
  e.preventDefault();
  userData.name = document.getElementById('userName').value;

    name: userData.name,
    email: userData.email,
    wa: userData.wa,
    demografi: bonusKey,
    hasil: personaResult,
    skor: scoreTally,
    timestamp: new Date().toISOString()
  };

  animateTransition(renderLoading);

/* ============ RESULT LOGIC ============ */

function computePersonaKey(){
  let best = PERSONA_ORDER[0];
  let bestScore = -1;
  PERSONA_ORDER.forEach(key => {
    const s = scoreTally[key] || 0;
    if(s > bestScore){
      bestScore = s;
      best = key;
    }
  });
  return best;
}

function renderResult(){
  const key = computePersonaKey();
  const persona = PERSONAS[key];
  const bonus = bonusKey ? BONUS[bonusKey] : null;

  const whyHtml = persona.why.map((w, i) => `<li><span class="chip">${i+1}</span><span>${w}</span></li>`).join('');

  const roadmapHtml = persona.roadmap.map((step, i) => `

      <div class="tl-body">

    </div>
  `).join('');

  app.innerHTML = `

      <ul class="why-list">${whyHtml}</ul>

      <hr class="divider">

      <div class="section-title">🗺️ Roadmap belajar kamu</div>
      <div class="timeline">${roadmapHtml}</div>

      <hr class="divider">

      <div class="product-panel">
        <h3>${persona.product.title}</h3>
        <p>${persona.product.blurb}</p>
        <a class="btn btn-gold" href="${persona.product.url}" target="_blank" rel="noopener">Buka Panduan <span>→</span></a>
      </div>

      ${bonus ? `
      <div class="bonus-note" style="margin-top:24px;">
        ${bonus.text} <a href="${bonus.url}" target="_blank" rel="noopener">Lihat di sini</a>
      </div>` : ``}

        <p>${RESOURCE_UMUM.text} <a href="${RESOURCE_UMUM.url}" target="_blank" rel="noopener">Lihat panduannya</a></p>
      </div>

      <div class="restart-wrap">
        <button class="btn btn-ghost" onclick="restart()">↻ Coba lagi dari awal</button>
      </div>
    </div>
  `;
}

  step = 0;
  scoreTally = {};
  bonusKey = null;
  animateTransition(renderQuiz);
}
